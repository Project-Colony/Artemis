name: CI

# Action refs are pinned to commit SHAs with the version in a trailing comment;
# .github/dependabot.yml bumps both together. dtolnay/rust-toolchain is pinned
# on master with `toolchain: stable` rather than on its `stable` branch: that
# branch is rebased onto every master commit, so a SHA pinned on it stops being
# reachable from any branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads the repository. Declare it, so the GITHUB_TOKEN does not
# inherit the repository's default (possibly write) permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Check and Test run on every desktop OS the client targets, so a change in
  # the GUI or TLS stack (wgpu, winit, schannel, security-framework) is proven
  # on Windows and macOS too. Format and Clippy are OS-independent.
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

  # rust-version in Cargo.toml is a promise about who can build Artemis. Without
  # this job nothing ever builds on it, and it drifts.
  #
  # RUSTUP_TOOLCHAIN is what pins the cargo invocations: it outranks the
  # runner's rustup default. The rustc check makes a pin that silently stopped
  # working fail loudly.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | tr -d ' "' | cut -d= -f2)
          [ -n "$version" ] || { echo "::error::could not read rust-version from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build on the declared floor
        run: |
          rustc --version | grep -q "^rustc ${RUSTUP_TOOLCHAIN}[. ]" \
            || { echo "::error::expected rustc ${RUSTUP_TOOLCHAIN}, got $(rustc --version)"; exit 1; }
          cargo check --locked --workspace --all-targets

  # The relay's database tests are #[ignore]d where no Postgres runs, as in the
  # matrix above. This job gives them a server and runs them too.
  relay-db:
    name: Relay database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artemis
          POSTGRES_PASSWORD: artemis
          POSTGRES_DB: artemis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://artemis:artemis@localhost:5432/artemis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p artemis-server -- --include-ignored
