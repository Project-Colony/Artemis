# Keep the supply chain current: GitHub Actions (pinned by SHA - Dependabot
# bumps the SHA and the version comment together) and Cargo dependencies.
#
# From Project-Colony-Resources templates/dependabot.yml. Dependabot opening a
# PR is not the rule being followed, merging it is. See design/dependencies.md:
# everything is on its latest release, always.
version: 2
updates:
  # A stale action is the same problem as a stale crate, with more privileges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Transitive crates too, so the lockfile stays current without a manual
    # `cargo update`.
    allow:
      - dependency-type: all
    groups:
      # Minor and patch bumps arrive as one PR, so a routine week is one review
      # rather than fifteen. Majors stay separate, they deserve their own read.
      cargo-minor:
        update-types: ["minor", "patch"]
