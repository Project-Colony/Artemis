[workspace]
resolver = "2"
members = [
    "crates/artemis-client",
    "crates/artemis-core",
    "crates/artemis-server",
    "crates/artemis-auth",
    "crates/artemis-p2p",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Artemis"

[workspace.dependencies]
# Shared across crates
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.27.0", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures = "0.3.34"
rand = "0.10.3"
base64 = "0.23.1"

# GUI
iced = { version = "0.14.0", features = ["tokio", "svg", "image"] }

# Auth
# Without its reqwest feature: oauth2 5 builds on reqwest 0.12, so the token
# exchange goes through our own client instead (artemis_auth::oauth_http).
oauth2 = { version = "5.0.0", default-features = false }
# The features reqwest 0.12 enabled by default, with the OS TLS stack (0.13
# switched its default to rustls on aws-lc-rs), plus json, form and query.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "form", "query"] }

# P2P / QUIC
quinn = "0.11.12"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rcgen = "0.14.10"

# Crypto
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
hkdf = "0.13.0"
sha2 = "0.11.0"
zeroize = "1.9.1"

# Local storage. Held at 0.39: rusqlite 0.40 links libsqlite3-sys 0.38, and
# sqlx 0.9 caps libsqlite3-sys below 0.38. Cargo checks `links` across optional
# dependencies too, so this applies even though sqlx's SQLite driver is off.
rusqlite = { version = "0.39.0", features = ["bundled"] }

# Desktop utilities
open = "5.4.4"

# Server (kept as optional relay)
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower-http = { version = "0.7.1", features = ["trace"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
dotenvy = "0.15.7"

# WebSocket client
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
