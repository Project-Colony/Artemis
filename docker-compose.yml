services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artemis
      # Set in .env (see .env.example); compose refuses to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: artemis
    # Loopback only: a published port bypasses host firewall input rules.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - artemis_pgdata:/var/lib/postgresql/data

volumes:
  artemis_pgdata:
